<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Order — Aliya Rose Nursery</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .order-container {
      max-width: 600px;
      margin: 2rem auto;
      background: #ffffff;
      padding: 1.8rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    .cart-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
    }
    .cart-table th, .cart-table td {
      padding: 0.75rem;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      font-size: 0.95rem;
    }
    .cart-table th {
      background: #fdf2f4;
      color: #881337;
    }
    .qty-input {
      width: 60px;
      padding: 0.3rem;
      text-align: center;
      border: 1px solid #d1d5db;
      border-radius: 4px;
    }
    .remove-btn {
      background: none;
      border: none;
      color: #dc2626;
      cursor: pointer;
      font-size: 1rem;
    }
    .form-group {
      margin-bottom: 1.1rem;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #1f2937;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      box-sizing: border-box;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #be123c;
    }
    .whatsapp-btn {
      width: 100%;
      background-color: #25D366;
      color: #ffffff;
      border: none;
      padding: 0.9rem;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .whatsapp-btn:hover {
      background-color: #1ebe5d;
    }
  </style>
</head>
<body>

  <header>
    <h1>Aliya Rose Nursery</h1>
    <p>Shikarpur, Kolkata, West Bengal</p>
  </header>

  <nav class="sticky-nav">
    <a href="index.html" class="nav-brand">← Back to Catalog</a>
  </nav>

  <main>
    <div class="order-container">
      <h2 style="margin-top: 0;">Review Your Multi-Variety Order</h2>
      <p class="text-muted text-sm" style="margin-bottom: 1.2rem;">
        Check your selected rose varieties and quantities below, then provide your delivery details.
      </p>

      <!-- Cart Item List -->
      <div id="cartSection">
        <table class="cart-table">
          <thead>
            <tr>
              <th>Variety & Code</th>
              <th style="width: 80px;">Qty</th>
              <th style="width: 50px;">Action</th>
            </tr>
          </thead>
          <tbody id="cartTableBody">
            <!-- Populated via JavaScript -->
          </tbody>
        </table>
      </div>

      <form id="whatsappOrderForm" onsubmit="sendToWhatsApp(event)">
        <div class="form-group">
          <label for="customerName">Your Full Name *</label>
          <input type="text" id="customerName" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="customerAddress">Delivery Address (with Pin Code) *</label>
          <textarea id="customerAddress" rows="3" placeholder="House/Village, Post Office, District, Pin Code" required></textarea>
        </div>

        <button type="submit" class="whatsapp-btn" id="submitBtn">
          📲 Send Complete Order on WhatsApp
        </button>
      </form>
    </div>
  </main>

  <footer>
    <p><strong>Aliya Rose Nursery</strong> — Shikarpur, Kolkata, West Bengal</p>
  </footer>

  <script>
    const NURSERY_WHATSAPP_NUMBER = "916290488309";
    let cart = JSON.parse(localStorage.getItem("aliyaCart")) || [];

    window.addEventListener("DOMContentLoaded", () => {
      // If user came from a direct "Order" button from an older link or single item view
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const name = params.get("name");
      if (code && name) {
        if (!cart.some(item => item.code === code)) {
          cart.push({ code: code, name: name, qty: 1 });
          localStorage.setItem("aliyaCart", JSON.stringify(cart));
        }
      }
      renderCheckoutCart();
    });

    function renderCheckoutCart() {
      const tbody = document.getElementById("cartTableBody");
      const submitBtn = document.getElementById("submitBtn");
      tbody.innerHTML = "";

      if (cart.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#6b7280; padding:1.5rem;">Your cart is empty. <a href="index.html">Browse catalog</a></td></tr>`;
        if (submitBtn) submitBtn.style.display = "none";
        return;
      }

      if (submitBtn) submitBtn.style.display = "flex";

      cart.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${item.name}</strong><br><small style="color:#6b7280;">${item.code}</small></td>
          <td><input type="number" class="qty-input" min="1" value="${item.qty}" onchange="updateQty('${item.code}', this.value)"></td>
          <td><button type="button" class="remove-btn" onclick="removeItem('${item.code}')" title="Remove">🗑️</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateQty(code, qty) {
      let item = cart.find(i => i.code === code);
      if (item) {
        item.qty = parseInt(qty) || 1;
        if (item.qty <= 0) item.qty = 1;
        localStorage.setItem("aliyaCart", JSON.stringify(cart));
      }
    }

    function removeItem(code) {
      cart = cart.filter(i => i.code !== code);
      localStorage.setItem("aliyaCart", JSON.stringify(cart));
      renderCheckoutCart();
    }

    function sendToWhatsApp(event) {
      event.preventDefault();

      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }

      const name = document.getElementById("customerName").value.trim();
      const address = document.getElementById("customerAddress").value.trim();

      let message = `*Multi-Variety Rose Order — Aliya Rose Nursery*\n\n`;
      message += `📋 *Selected Varieties:*\n`;
      
      cart.forEach((item, index) => {
        message += `${index + 1}. *${item.name}* (${item.code}) — *Qty:* ${item.qty}\n`;
      });

      message += `\n👤 *Customer Name:* ${name}\n`;
      message += `📍 *Delivery Address:* ${address}`;

      const whatsappURL = `https://wa.me/${NURSERY_WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
      window.open(whatsappURL, "_blank");
    }
  </script>

</body>
</html>
