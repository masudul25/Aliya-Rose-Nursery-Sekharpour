<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Place Order — Aliya Rose Nursery</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .order-container {
      max-width: 520px;
      margin: 2rem auto;
      background: #ffffff;
      padding: 1.8rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    .selected-plant-box {
      background: #fdf2f4;
      border-left: 4px solid #be123c;
      padding: 0.9rem 1rem;
      border-radius: 6px;
      margin-bottom: 1.2rem;
    }
    .form-group {
      margin-bottom: 1.1rem;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #1f2937;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      box-sizing: border-box;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #be123c;
    }
    .whatsapp-btn {
      width: 100%;
      background-color: #25D366;
      color: #ffffff;
      border: none;
      padding: 0.9rem;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .whatsapp-btn:hover {
      background-color: #1ebe5d;
    }
  </style>
</head>
<body>

  <header>
    <h1>Aliya Rose Nursery</h1>
    <p>Shikarpur, Kolkata, West Bengal</p>
  </header>

  <nav class="sticky-nav">
    <a href="index.html" class="nav-brand">← Back to Catalog</a>
  </nav>

  <main>
    <div class="order-container">
      <h2 style="margin-top: 0;">Place Your Order</h2>
      <p class="text-muted text-sm" style="margin-bottom: 1.2rem;">
        Fill in the details below to send your order directly to our nursery WhatsApp.
      </p>

      <!-- Auto-filled if clicked from a rose card -->
      <div class="selected-plant-box" id="plantPreview" style="display: none;">
        <div style="font-size: 0.85rem; color: #6b7280;">Selected Variety:</div>
        <strong id="displayPlant" style="font-size: 1.1rem; color: #881337;"></strong>
      </div>

      <form id="whatsappOrderForm" onsubmit="sendToWhatsApp(event)">
        <div class="form-group" id="manualVarietyGroup">
          <label for="varietyInput">Rose Variety / Code *</label>
          <input type="text" id="varietyInput" placeholder="e.g., Double Delight (D1 BI HT F)" required>
        </div>

        <div class="form-group">
          <label for="quantity">Quantity (Number of Plants) *</label>
          <input type="number" id="quantity" min="1" value="1" placeholder="Enter quantity" required>
        </div>

        <div class="form-group">
          <label for="customerName">Your Full Name *</label>
          <input type="text" id="customerName" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="customerAddress">Delivery Address (with Pin Code) *</label>
          <textarea id="customerAddress" rows="3" placeholder="House/Village, Post Office, District, Pin Code" required></textarea>
        </div>

        <button type="submit" class="whatsapp-btn">
          📲 Send Order on WhatsApp
        </button>
      </form>
    </div>
  </main>

  <footer>
    <p><strong>Aliya Rose Nursery</strong> — Shikarpur, Kolkata, West Bengal</p>
  </footer>

  <script>
    const NURSERY_WHATSAPP_NUMBER = "916290488309";

    // Read rose code & name from URL parameters (when user clicks "Order" on a card)
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const name = params.get("name");

      if (code || name) {
        const label = `${name || ""} ${code ? `(${code})` : ""}`.trim();
        document.getElementById("displayPlant").textContent = label;
        document.getElementById("plantPreview").style.display = "block";
        document.getElementById("varietyInput").value = label;
        document.getElementById("manualVarietyGroup").style.display = "none";
      }
    });

    // Format message and open WhatsApp
    function sendToWhatsApp(event) {
      event.preventDefault();

      const variety = document.getElementById("varietyInput").value.trim();
      const qty = document.getElementById("quantity").value.trim();
      const name = document.getElementById("customerName").value.trim();
      const address = document.getElementById("customerAddress").value.trim();

      const message =
        `*New Rose Order — Aliya Rose Nursery*\n\n` +
        `🌹 *Variety:* ${variety}\n` +
        `📦 *Quantity:* ${qty} plants\n` +
        `👤 *Name:* ${name}\n` +
        `📍 *Address:* ${address}`;

      const whatsappURL = `https://wa.me/${NURSERY_WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
      window.open(whatsappURL, "_blank");
    }
  </script>

</body>
</html>
